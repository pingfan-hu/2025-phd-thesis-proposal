project:
  type: website
  output-dir: _site

pagetitle: "PhD Thesis Proposal"
title: "PhD Thesis Proposal:<br><span style='font-size: 0.7em;'>Battery Electric Vehicle Smart Charging Adoption,<br>Grid Peak-Shaving Quantification, and<br>The `surveydown` Survey Platform</span>"
author: "<br>**Pingfan Hu**<br>George Washington University"

format:
  touhou-revealjs:
    smaller: false
    css: styles/slides.css
    include-after-body:
      - styles/bubble-align.html
    bibliography: bibliography.bib
    slide-number: true
    embed-resources: false
    auto-stretch: false
    preview-links: auto
    logo: figs/logo.png
    footer: "<a href='https://pingfan.org'>Pingfan Hu</a> - PhD Thesis Proposal"
    link-external-newwindow: true
    link-external-icon: false
    center-title-slide: true
    code-block-height: 650px
    title-slide-attributes:
      class: custom-title-slide
      style: "text-align:left; background-image: url(figs/logo.png);"

execute: 
  warning: false
  echo: false
